<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Підемо? — Створи персональне запрошення</title>
<meta name="description" content="Створи персональне запрошення та надішли його одним посиланням.">
<meta name="theme-color" content="#1a0b2e">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&family=Unbounded:wght@500;700&family=Oswald:wght@500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#1a0b2e;--bg2:#4a1259;--bg3:#ff4d8d;--ink:#fff;--mut:rgba(255,255,255,.68);
  --acc:#ff4d8d;--acc2:#ffb36b;--card:rgba(255,255,255,.10);--cardb:rgba(255,255,255,.18);
  --field:rgba(255,255,255,.12);--onacc:#fff;
  --fd:'Unbounded',system-ui,sans-serif;--fb:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#14091f;overscroll-behavior:none}
body{position:relative;overflow:hidden;font-family:var(--fb);color:var(--ink);font-size:16px;line-height:1.5}
#bg{position:fixed;inset:0;z-index:0;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-size:220% 220%;animation:drift 22s ease-in-out infinite;transition:filter .6s}
@keyframes drift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.orb{position:fixed;z-index:0;width:70vmax;height:70vmax;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none;will-change:transform;animation:orb 18s ease-in-out infinite}
.orb.a{left:-30vmax;top:-20vmax;background:radial-gradient(circle,var(--acc),transparent 65%)}
.orb.b{right:-35vmax;bottom:-25vmax;background:radial-gradient(circle,var(--acc2),transparent 65%);animation-delay:-9s}
@keyframes orb{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(8vmax,6vmax,0) scale(1.15)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.screen{position:absolute;inset:0;z-index:2;display:none;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen.active{display:block;animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap{max-width:520px;margin:0 auto;padding:18px 18px 40px}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.15;letter-spacing:-.01em}
.logo{font-size:clamp(46px,17vw,84px);font-weight:700;background:linear-gradient(120deg,#fff,var(--acc2) 45%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 30px rgba(255,255,255,.18))}
.sub{color:var(--mut);font-size:clamp(16px,4.4vw,19px)}
.btn{appearance:none;border:0;cursor:pointer;font:800 17px var(--fb);color:var(--onacc);min-height:56px;padding:0 26px;border-radius:20px;width:100%;
  background:linear-gradient(120deg,var(--acc),var(--acc2));box-shadow:0 10px 30px -8px var(--acc),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,filter .2s;touch-action:manipulation}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--cardb);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn.sm{min-height:46px;font-size:15px;border-radius:16px;padding:0 16px;width:auto}
.row{display:flex;gap:10px}.row>*{flex:1}
.card{background:var(--card);border:1.5px solid var(--cardb);border-radius:24px;padding:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.stack{display:flex;flex-direction:column;gap:14px}
label.l{display:block;font-weight:800;font-size:14px;margin:0 0 6px;opacity:.9}
.field{width:100%;min-height:54px;border-radius:16px;border:1.5px solid transparent;background:var(--field);color:var(--ink);font:600 16px var(--fb);padding:14px 16px;outline:0;transition:border-color .2s}
.field:focus{border-color:var(--acc)}textarea.field{min-height:130px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;border:1.5px solid var(--cardb);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 16px;font:700 15px var(--fb);cursor:pointer;min-height:44px}
.chip.on{background:linear-gradient(120deg,var(--acc),var(--acc2));color:var(--onacc);border-color:transparent}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:linear-gradient(120deg,#ffd23f,#ff9f1c);color:#3b2200}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:20px;border:1.5px solid var(--cardb);background:var(--card);color:var(--ink);font:800 15px var(--fb);cursor:pointer;min-height:96px;transition:transform .15s}
.type span{font-size:30px}.type.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 40%,transparent),0 12px 30px -10px var(--acc);transform:translateY(-2px)}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 18px}
.pill{background:var(--card);border:1.5px solid var(--cardb);color:var(--ink);border-radius:999px;padding:9px 14px;font:700 14px var(--fb);cursor:pointer;min-height:40px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps .card{display:flex;gap:14px;align-items:center;padding:14px 16px}
.steps .n{flex:0 0 40px;height:40px;border-radius:14px;display:grid;place-items:center;font:800 18px var(--fd);background:linear-gradient(120deg,var(--acc),var(--acc2));color:var(--onacc)}
.float{position:absolute;font-size:28px;animation:fl 6s ease-in-out infinite;opacity:.9}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(8deg)}}
.hero{position:relative;padding:34px 0 26px;text-align:center}
/* wizard */
.wz{display:flex;flex-direction:column;height:100%}
.wz .body{flex:1;overflow-y:auto;padding:0 18px 18px;-webkit-overflow-scrolling:touch}
.wz .bar{padding:12px 18px 14px;display:flex;gap:10px;background:linear-gradient(to top,rgba(0,0,0,.28),transparent)}
.prog{height:6px;border-radius:9px;background:var(--card);overflow:hidden;margin:2px 0 18px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.tcard{flex:0 0 118px;height:96px;border-radius:18px;border:2px solid transparent;color:#fff;font:800 13px var(--fb);padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;position:relative;scroll-snap-align:start}
.tcard.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.tcard .badge{position:absolute;top:8px;right:8px}
.photos{display:flex;gap:10px;flex-wrap:wrap}.ph{width:86px;height:86px;border-radius:16px;background-size:cover;background-position:center;position:relative}
.ph button{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:16px}
.add{width:86px;height:86px;border-radius:16px;border:2px dashed var(--cardb);background:transparent;color:var(--ink);font-size:30px;cursor:pointer}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.sw input{appearance:none;width:54px;height:32px;border-radius:99px;background:var(--field);position:relative;transition:.25s;flex:0 0 54px;cursor:pointer}
.sw input::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s}
.sw input:checked{background:linear-gradient(120deg,var(--acc),var(--acc2))}.sw input:checked::after{transform:translateX(22px)}
.vari{cursor:pointer;text-align:left;font:600 15px var(--fb);color:var(--ink);background:var(--field);border:1.5px solid var(--cardb);border-radius:16px;padding:14px;width:100%}
.url{display:flex;gap:8px;align-items:center;background:var(--field);border-radius:16px;padding:6px 6px 6px 14px;font:700 14px var(--fb);word-break:break-all}
.small{font-size:13px;color:var(--mut)}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font:800 12px var(--fb);background:var(--field)}
.st.ACCEPTED{background:#1fbf75;color:#032}.st.DECLINED{background:#6b7280;color:#fff}.st.PENDING{background:#ffd23f;color:#3b2200}.st.EXPIRED,.st.DELETED{background:#444;color:#ddd}.st.ACTIVE{background:var(--acc);color:var(--onacc)}
/* invitation */
#invite{padding:0}
.inv{min-height:100%;position:relative;display:flex;flex-direction:column}
.stage{position:relative;height:0;overflow:hidden;transition:height 1s cubic-bezier(.2,.8,.2,1);flex:0 0 auto}
.stage.full{height:100%}.stage.mini{height:min(42vh,330px)}.stage canvas{width:100%;height:100%;display:block}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:30px 24px;min-height:100%}
.seal{font-size:92px;animation:beat 1.4s ease-in-out infinite;filter:drop-shadow(0 10px 30px var(--acc))}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.loader{width:64px;height:64px;position:relative}.loader i{position:absolute;inset:0;font-style:normal;font-size:54px;animation:beat 1s infinite}
.content{width:100%;max-width:520px;margin:0 auto;padding:6px 18px 60px;display:flex;flex-direction:column;gap:16px}
.blk{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.blk.on{opacity:1;transform:none}
.greet{font-family:var(--fd);font-size:clamp(30px,10vw,46px);line-height:1.1}
.ttl{font-family:var(--fd);font-size:clamp(22px,6.5vw,30px);margin-bottom:8px}
.txt{white-space:pre-wrap;font-size:18px}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:24px}.gal img{flex:0 0 100%;scroll-snap-align:center;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:24px}
.when{display:flex;gap:14px;align-items:center}.when .big{font:700 28px var(--fd)}
.cd{font:800 20px var(--fb);font-variant-numeric:tabular-nums;color:var(--acc2);margin-top:8px}
.map{border-radius:20px;overflow:hidden;margin:12px 0}.map svg{display:block;width:100%;height:auto}
.replybox{padding-bottom:130px;position:relative}
.ans{display:flex;flex-direction:column;gap:12px;position:relative;min-height:190px}
.yes{min-height:66px;font-size:20px}
.no{transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.done{text-align:center;padding:10px 0}.done .big{font:700 clamp(28px,9vw,40px) var(--fd)}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.back{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20}
.fab{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:linear-gradient(160deg,var(--bg1),var(--bg2));border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,.8,.2,1);border:1.5px solid var(--cardb);color:var(--ink)}
@keyframes up{from{transform:translateY(60%)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:90;background:#000d;color:#fff;border-radius:16px;padding:12px 18px;font:700 15px var(--fb);max-width:88%;text-align:center;animation:in .3s}
.qrbox{background:#fff;border-radius:22px;padding:8px;display:grid;place-items:center}.qrbox svg,.qrbox img{width:100%;height:auto;display:block;border-radius:16px}
.hr{height:1px;background:var(--cardb);margin:6px 0}
@media (prefers-reduced-motion:reduce){#bg,.orb,.seal,.float,.loader i{animation:none}.blk{transition:none}}
.reduce *{animation:none!important}.reduce .blk{transition:none}
@media (min-width:768px){.wrap,.content{max-width:560px}}
/* ===== v2: нове ===== */
#bgimg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;opacity:0;transition:opacity .6s;pointer-events:none}
#bgimg.on{opacity:1}
#bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,4,24,.42),rgba(10,4,24,.64))}
.chip:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled{cursor:not-allowed}
.note{padding:12px 14px;border-radius:14px;background:var(--field);font-size:14px;line-height:1.45}
.skel{height:86px;border-radius:16px;background:linear-gradient(90deg,var(--field),rgba(255,255,255,.26),var(--field));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.vari:active{transform:scale(.99)}
.vari .vt{display:block;margin-top:8px;font-weight:800;font-size:13px;color:var(--acc2)}
/* зайчик, що соромиться */
.shywrap{position:relative;width:min(230px,62vw);margin:2px auto 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.shy{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 14px 22px rgba(0,0,0,.28))}
.shy *{transform-box:fill-box}
.shy .head{transform-origin:50% 95%;animation:sway 3.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.shy .paw.l{animation:pawl 5.5s ease-in-out infinite}
.shy .paw.r{animation:pawr 5.5s ease-in-out infinite}
@keyframes pawl{0%,28%{transform:translate(0,0) rotate(0)}40%,70%{transform:translate(-17px,-14px) rotate(-32deg)}84%,100%{transform:translate(0,0) rotate(0)}}
@keyframes pawr{0%,28%{transform:translate(0,0) rotate(0)}40%,70%{transform:translate(17px,-14px) rotate(32deg)}84%,100%{transform:translate(0,0) rotate(0)}}
.shy .ear.l{transform-origin:50% 95%;animation:earl 5.5s ease-in-out infinite}
.shy .ear.r{transform-origin:50% 95%;animation:earr 5.5s ease-in-out infinite}
@keyframes earl{0%,28%{transform:rotate(-24deg)}40%,70%{transform:rotate(0)}84%,100%{transform:rotate(-24deg)}}
@keyframes earr{0%,28%{transform:rotate(24deg)}40%,70%{transform:rotate(0)}84%,100%{transform:rotate(24deg)}}
.shy .blush{transform-origin:50% 50%;animation:blush 2.2s ease-in-out infinite}
@keyframes blush{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}}
.shy .eyes{transform-origin:50% 50%;animation:blink 5.5s infinite}
@keyframes blink{0%,50%,56%,100%{transform:scaleY(1)}53%{transform:scaleY(.1)}}
.shywrap.tap .shy{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-22px) scale(1.04,.97)}100%{transform:translateY(0)}}
.shyh{position:absolute;font-size:22px;opacity:0;animation:rise 4.4s ease-in infinite}
.shyh.a{left:12%;top:20%;animation-delay:.4s}.shyh.b{left:78%;top:12%;animation-delay:1.8s}.shyh.c{left:48%;top:-2%;animation-delay:3s}
@keyframes rise{0%{opacity:0;transform:translateY(16px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-52px) scale(1.15)}}
.shycap{text-align:center;font:700 15px var(--fb);color:var(--mut);min-height:24px;margin-bottom:18px}
/* оплата */
.cardnum{font:800 22px var(--fb);letter-spacing:.07em;text-align:center;padding:15px 10px;border-radius:16px;background:var(--field);border:1.5px dashed var(--cardb);cursor:pointer}
.bigamt{font:700 42px var(--fd);line-height:1.1}
.pay .small{margin:0}
.paystep{display:flex;gap:12px;align-items:flex-start}
.paystep i{flex:0 0 28px;height:28px;border-radius:10px;display:grid;place-items:center;font:800 14px var(--fb);font-style:normal;background:linear-gradient(120deg,var(--acc),var(--acc2));color:var(--onacc)}
.codebox{font:800 20px var(--fb);letter-spacing:.1em;text-align:center;padding:10px;border-radius:14px;background:var(--field);cursor:pointer}
/* карта */
.mapbox{height:min(50vh,400px);border-radius:18px;overflow:hidden;position:relative;z-index:0;isolation:isolate;background:rgba(127,127,127,.2)}
.pin{background:none!important;border:0!important;font-size:30px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.leaflet-container{font-family:var(--fb)}
/* фінальна анімація відповіді */
.fin{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 40%,rgba(255,110,170,.2),rgba(10,4,24,.82));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .3s;touch-action:manipulation}
.fin.sad{background:radial-gradient(circle at 50% 40%,rgba(110,150,230,.22),rgba(6,10,32,.88))}
.fin.out{opacity:0;transition:opacity .35s}
.fin.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:flash .5s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.85}to{opacity:0}}
.finstage{position:absolute;inset:0}.finstage canvas{width:100%;height:100%;display:block}
.fincap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);text-align:center;padding:0 24px;font:700 clamp(24px,7vw,34px)/1.2 var(--fd);color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45);opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.fincap.on{opacity:1;transform:none}
.fincap small{display:block;margin-top:10px;font:600 14px var(--fb);opacity:.75}
.finemoji{position:absolute;inset:0;display:grid;place-items:center;font-size:88px;animation:beat 1.2s infinite}
.admtest{display:flex;gap:8px;flex-wrap:wrap}
.admtest .btn{flex:1 1 30%}
.pill{white-space:nowrap}
.no.pop{animation:popno .5s ease-in forwards;pointer-events:none}
@keyframes popno{35%{transform:scale(1.35) rotate(-3deg)}100%{transform:scale(0) rotate(12deg);opacity:0}}
.ans{align-items:stretch}.ans .no{align-self:stretch}
.ily{position:fixed;inset:0;z-index:75;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(120,10,50,.55),rgba(10,2,16,.94));animation:fade .4s}
.ily.out{opacity:0;transition:opacity .45s}
.shy .paw.l,.shy .paw.r,.shy .ear.l,.shy .ear.r{animation:none!important;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.shy .ear.l{transform:rotate(-24deg)}.shy .ear.r{transform:rotate(24deg)}
.shywrap:hover .ear.l,.shywrap.peek .ear.l,.shywrap:hover .ear.r,.shywrap.peek .ear.r{transform:rotate(0)}
.shywrap:hover .paw.l,.shywrap.peek .paw.l{transform:translate(-17px,-14px) rotate(-32deg)}
.shywrap:hover .paw.r,.shywrap.peek .paw.r{transform:translate(17px,17px) rotate(0)}
.shywrap:hover .paw.r,.shywrap.peek .paw.r{transform:translate(17px,-14px) rotate(32deg)}
.seg{display:flex;gap:6px;margin:10px 0 16px}.seg button{flex:1;height:8px;border-radius:99px;border:0;padding:0;background:var(--field);transition:.3s}.seg button.done{background:linear-gradient(90deg,var(--acc),var(--acc2));cursor:pointer}.seg button.cur{background:var(--acc);box-shadow:0 0 0 3px var(--field)}
.legal p{margin:0 0 10px;line-height:1.5;font-size:14px}.legal h3{margin:14px 0 6px;font-size:15px}
.req{color:#ff6b8b}.bad{outline:2px solid #ff6b8b!important}
.later{background:none;border:0;color:var(--mut);font:600 13px var(--fb);text-decoration:underline;cursor:pointer;margin:6px auto 0;display:block}
.sw2{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw2.on{border-color:var(--acc)}
.no.wig{animation:wig .5s}
@keyframes wig{20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
</style>
</head>
<body>
<div id="bg"></div><div id="bgimg"></div><div class="orb a"></div><div class="orb b"></div>
<canvas id="fx"></canvas>

<section class="screen" id="home"></section>
<section class="screen" id="wizard"></section>
<section class="screen" id="share"></section>
<section class="screen" id="mine"></section>
<section class="screen" id="invite"></section>
<section class="screen" id="admin"></section>
<button class="pill fab" id="rm" aria-pressed="false">⚙️ Налаштування</button>

<script>
"use strict";

async function route(){const m=location.pathname.match(/^\/i\/([A-Za-z0-9]{12})\/?$/)||location.hash.match(/^#\/i\/([A-Za-z0-9]{12})$/);
  if(m&&SERVER){try{const v=await api('/api/public/'+m[1]);return openInvite(v.invite,{recipient:!v.isOwner,guest:v.guest,serverTok:m[1]})}catch(e){return openMissing()}}
  if(m){reload();let inv=null,guest=null;for(const i of S.invites){if(i.token===m[1]){inv=i;break}const g=(i.guests||[]).find(x=>x.token===m[1]);if(g){inv=i;guest=g;break}}
    if(!inv)return openMissing();const own=!inv.ownerId||inv.ownerId===S.uid;return openInvite(inv,{recipient:!own,guest})}
  if(location.hash==='#/admin')return admin();home()}
addEventListener('hashchange',route);save();(async()=>{await detectServer();await sync();route()})();
let lastN=Date.now();
